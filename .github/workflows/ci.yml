name: CI

# Gate every change to main. Wire this workflow into branch protection
# (Settings → Branches → require this check + a review before merge) so a broken
# build or an unresolved conflict can never reach main again.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Fail fast on unresolved merge-conflict markers (this reached main once).
      - name: Conflict-marker check
        run: |
          if git grep -nE '^(<<<<<<<|>>>>>>>|=======)( |$)' -- ':!*.lock' ':!package-lock.json'; then
            echo "::error::Unresolved merge-conflict markers found."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Strict, reproducible install from the lockfile — fails if package.json
      # and package-lock.json have drifted apart instead of silently resolving.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # The crawler tests launch a real Chromium (src/lib/crawler/*.test.ts), so
      # the browser binary and its OS libraries must be present or `npm test`
      # fails with "Executable doesn't exist". Pinned implicitly to the installed
      # Playwright version via the lockfile.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      # Schema and committed migrations must agree: generating should produce no
      # new files. If it does, someone changed the schema without a migration.
      - name: Migrations in sync with schema
        run: |
          npx drizzle-kit generate
          if ! git diff --quiet -- drizzle; then
            echo "::error::Schema changed without a migration. Run 'npm run db:generate' and commit drizzle/."
            git --no-pager diff --stat -- drizzle
            exit 1
          fi

  # Blocking supply-chain gate for what actually ships: high/critical
  # vulnerabilities in production dependencies fail the build. Dev-only
  # tooling (drizzle-kit, vitest, etc.) is excluded deliberately — it never
  # reaches the deployed image, and gating on it would block merges on
  # advisories with no production exposure. A specific advisory that doesn't
  # apply to this deployment (e.g. a Windows-only path issue on a Linux
  # container) needs a documented, scoped exception here, not a blanket `|| true`.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Dependency audit (production, high severity+)
        run: npm audit --omit=dev --audit-level=high

  # Container-only failures (e.g. a lockfile entry that's fine on the host
  # platform but missing for the Dockerfile's Linux base image) don't show up
  # in the jobs above, since they run npm ci directly on the runner rather
  # than inside the image. Build the real image so that class of bug is
  # caught here instead of on the next deploy.
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t webind:ci .

  # Golden-path browser tests: signup, login, the anonymous free report, and
  # nav consistency across authenticated pages — the layer unit/integration
  # tests can't cover (an actual browser driving the actual rendered app).
  # A separate job, deliberately not required by branch protection yet: it
  # spins up its own ephemeral Postgres (embedded-postgres, a real Postgres
  # binary) and a real `next dev` server (see e2e/global-setup.ts), which is
  # heavier and slower than the other jobs and shouldn't block a merge on its
  # own until it's proven stable in CI across a few real runs.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: E2E tests
        run: npm run test:e2e
